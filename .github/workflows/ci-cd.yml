name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # =======================================================
  # 0단계. 변경 파일 감지 (Selective Pipeline Path Filtering)
  # =======================================================
  detect-changes:
    name: 🔍 Detect Changed Files
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🎯 Filter Changed Paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/**'
              - '.github/actions/**'
            frontend:
              - 'frontend/**'

  # =======================================================
  # 1단계. Build Job (Composite Action 활용 + 아티팩트 업로드)
  # =======================================================
  build:
    name: 🏗️ Build Backend
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🛠️ Setup Node.js & Dependencies (Composite Action)
        uses: ./.github/actions/setup-node-env
        with:
          node-version: 20.x
          working-directory: backend

      - name: ⚙️ TypeScript Compile
        shell: bash
        run: |
          cd backend
          echo "⚙️ Compiling TypeScript..."
          npm run build

      - name: 📤 Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: backend/dist/
          retention-days: 7

  # =======================================================
  # 2단계. Test Job (Matrix 확장: 2 OS x 3 Node.js + Reusable Workflow)
  # =======================================================
  test:
    needs: [detect-changes, build]
    if: needs.detect-changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [18.x, 20.x, 22.x]
    uses: ./.github/workflows/reusable-lint-test.yml
    with:
      os: ${{ matrix.os }}
      node-version: ${{ matrix.node-version }}
      working-directory: backend
      artifact-name: backend-dist
    secrets: inherit

  # =======================================================
  # 3단계. Deploy Job (브랜치/PR 조건 기반 선택적 배포)
  # - PR 환경에서는 배포를 건너뛰고 main 머지 시에만 배포
  # - backend 관련 변경이 있을 때만 조건부 실행
  # =======================================================
  deploy:
    name: 🚀 Deploy to Production
    needs: [detect-changes, test]
    if: |
      (github.ref == 'refs/heads/main' && github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (needs.detect-changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-dist
          path: dist

      - name: 🛡️ Verify Build Artifact Integrity
        shell: bash
        run: |
          echo "🔍 Verifying compiled artifacts..."
          test -f dist/index.js || (echo "dist/index.js not found!" && exit 1)
          echo "✅ Build artifact verified successfully."
          ls -la dist/

      - name: 🌐 Deploy Application (Simulation)
        shell: bash
        run: |
          echo "=========================================="
          echo "🚀 Deploying FlowPlan Backend to Production..."
          echo "Target Environment: Production"
          echo "Event: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "Deployment Strategy: Blue-Green Rolling Update"
          echo "=========================================="
          echo "🎉 FlowPlan selective deployment completed successfully!"
