name: Issue SLA Tracker

on:
  schedule:
    # 매일 자정(UTC 00:00 / KST 09:00)에 실행
    - cron: '0 0 * * *'
  workflow_dispatch: # 수동 테스트 실행 지원

permissions:
  issues: write

jobs:
  track-sla:
    runs-on: ubuntu-latest
    steps:
      - name: ⏱️ Check Unanswered Issues Exceeding 48h SLA
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const now = new Date();
            const SLA_HOURS = 48;

            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              per_page: 100
            });

            for (const issue of openIssues) {
              if (issue.pull_request) continue; // PR 제외

              const created = new Date(issue.created_at);
              const diffHours = (now - created) / (1000 * 60 * 60);

              // 48시간 초과 및 코멘트가 1개 이하(자동응답 외에 사람 답변 없음)인 경우
              if (diffHours >= SLA_HOURS && issue.comments <= 1) {
                console.log(`[SLA Alert] Issue #${issue.number} exceeded ${SLA_HOURS} hours (${diffHours.toFixed(1)}h)`);

                // 1. 라벨 추가 (needs-attention)
                try {
                  await github.rest.issues.addLabels({
                    owner,
                    repo,
                    issue_number: issue.number,
                    labels: ['priority: high']
                  });
                } catch (e) {
                  console.warn('Label add warning:', e.message);
                }

                // 2. SLA 초과 알림 코멘트 작성
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issue.number,
                  body: `⚠️ **[SLA 경고]** 이 이슈는 등록된 지 ${diffHours.toFixed(0)}시간이 경과하였으나 담당자 피드백이 지연되고 있습니다. 확인 및 조치 부탁드립니다.`
                });
              }
            }
