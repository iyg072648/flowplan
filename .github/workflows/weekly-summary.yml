name: Weekly Project Summary

on:
  schedule:
    # 매주 월요일 KST 09:00 (UTC 일요일 24:00 / 00:00)
    - cron: '0 0 * * 1'
  workflow_dispatch: # 수동 보고서 발행 지원

permissions:
  issues: write
  contents: read

jobs:
  generate-summary:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📊 Aggregate Weekly Progress & Create Report Issue
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const oneWeekAgo = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000);

            // 1. 최근 7일간 닫힌 이슈 조회
            const closedIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'closed',
              since: oneWeekAgo.toISOString(),
              per_page: 100
            });
            const pureIssues = closedIssues.filter(i => !i.pull_request && new Date(i.closed_at) >= oneWeekAgo);

            // 2. 최근 7일간 머지된 PR 조회
            const closedPRs = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'closed',
              per_page: 100
            });
            const weeklyMergedPRs = closedPRs.filter(pr => pr.merged_at && new Date(pr.merged_at) >= oneWeekAgo);

            // 3. DORA 메트릭 최근 상태 확인 (로컬 파일 읽기)
            let doraInfo = '정보 없음';
            const fs = require('fs');
            if (fs.existsSync('dora-metrics.json')) {
              const metrics = JSON.parse(fs.readFileSync('dora-metrics.json', 'utf8'));
              doraInfo = `- 총 누적 배포: **${metrics.total_deployments}회**\n- 평균 리드타임: **${metrics.avg_lead_time_hours}시간**\n- 변경 실패율: **${metrics.change_failure_rate_percent}%**`;
            }

            const todayStr = new Date().toISOString().split('T')[0];
            const issueTitle = `📢 [주간 요약 보고서] ${todayStr} 프로젝트 활동 현황`;

            const issueBody = `
            ## 🗓️ FlowPlan 주간 프로젝트 활동 보고서 (${todayStr})

            지난 한 주 동안 완료된 작업 및 배포 메트릭 집계 현황입니다.

            ---

            ### ✅ 완료된 작업 및 이슈 (${pureIssues.length}건)
            ${pureIssues.length > 0 ? pureIssues.map(i => `- [#${i.number}] ${i.title} (@${i.user.login})`).join('\n') : '- 최근 7일간 완료된 이슈가 없습니다.'}

            ---

            ### 🚀 머지 및 배포된 PR (${weeklyMergedPRs.length}건)
            ${weeklyMergedPRs.length > 0 ? weeklyMergedPRs.map(p => `- [#${p.number}] ${p.title} (@${p.user.login})`).join('\n') : '- 최근 7일간 머지된 PR이 없습니다.'}

            ---

            ### 📈 최신 DORA 메트릭 현황
            ${doraInfo}

            ---
            *본 보고서는 \`.github/workflows/weekly-summary.yml\`에 의해 자동 생성되었습니다.*
            `;

            await github.rest.issues.create({
              owner,
              repo,
              title: issueTitle,
              body: issueBody.trim(),
              labels: ['documentation']
            });
